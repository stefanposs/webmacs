name: Release

on:
  push:
    tags:
      - "v*"          # triggered by: git tag v2.1.0 && git push --tags

permissions:
  contents: write    # create GitHub Releases + upload assets

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

env:
  DOCKERHUB_USER: stefanposs
  IMAGES: webmacs-backend webmacs-frontend webmacs-controller

jobs:
  # ── 1. Run full CI first ─────────────────────────────────────────────
  ci:
    uses: ./.github/workflows/ci.yml

  # ── 2. Build multi-arch images, push to Docker Hub & create OTA bundle
  build-and-push:
    runs-on: ubuntu-latest
    needs: ci
    steps:
      - uses: actions/checkout@v4

      - name: Set version from tag
        id: version
        run: echo "version=${GITHUB_REF_NAME#v}" >> "$GITHUB_OUTPUT"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Set up QEMU (for ARM64 cross-build)
        uses: docker/setup-qemu-action@v3
        with:
          platforms: linux/arm64

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ env.DOCKERHUB_USER }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      # Build & push multi-arch manifests to Docker Hub
      - name: Build & push multi-arch images to Docker Hub
        run: |
          VERSION="${{ steps.version.outputs.version }}"
          for svc in backend frontend controller; do
            echo "▶ Building & pushing ${DOCKERHUB_USER}/webmacs-${svc}..."
            docker buildx build \
              --platform linux/amd64,linux/arm64 \
              --tag "${DOCKERHUB_USER}/webmacs-${svc}:${VERSION}" \
              --tag "${DOCKERHUB_USER}/webmacs-${svc}:latest" \
              --push \
              -f "docker/${svc}.Dockerfile" .
          done

      # Build single-arch images for the OTA bundle (docker save needs local images)
      - name: Build local images for OTA bundle
        run: |
          VERSION="${{ steps.version.outputs.version }}"
          for svc in backend frontend controller; do
            for arch in amd64 arm64; do
              echo "▶ Building webmacs-${svc}:${VERSION}-${arch}..."
              docker buildx build \
                --platform "linux/${arch}" \
                --tag "webmacs-${svc}:${VERSION}-${arch}" \
                --output "type=docker,dest=${svc}-${arch}.tar" \
                -f "docker/${svc}.Dockerfile" .
              docker load -i "${svc}-${arch}.tar"
              rm -f "${svc}-${arch}.tar"
            done
          done

      - name: Create OTA bundle
        run: |
          VERSION="${{ steps.version.outputs.version }}"
          WORK_DIR=$(mktemp -d)

          echo "▶ Exporting images to tar..."
          docker save \
            "webmacs-backend:${VERSION}-amd64" \
            "webmacs-backend:${VERSION}-arm64" \
            "webmacs-frontend:${VERSION}-amd64" \
            "webmacs-frontend:${VERSION}-arm64" \
            "webmacs-controller:${VERSION}-amd64" \
            "webmacs-controller:${VERSION}-arm64" \
            -o "${WORK_DIR}/images.tar"

          IMAGES_SHA256=$(sha256sum "${WORK_DIR}/images.tar" | cut -d' ' -f1)
          echo "  SHA-256: ${IMAGES_SHA256}"

          cat > "${WORK_DIR}/manifest.json" <<EOF
          {
              "version": "${VERSION}",
              "images_sha256": "${IMAGES_SHA256}",
              "created_at": "$(date -u +%Y-%m-%dT%H:%M:%SZ)",
              "changelog": "WebMACS v${VERSION} — see GitHub Release notes",
              "images": [
                  "webmacs-backend:${VERSION}-amd64",
                  "webmacs-backend:${VERSION}-arm64",
                  "webmacs-frontend:${VERSION}-amd64",
                  "webmacs-frontend:${VERSION}-arm64",
                  "webmacs-controller:${VERSION}-amd64",
                  "webmacs-controller:${VERSION}-arm64"
              ]
          }
          EOF

          cp docker-compose.prod.yml "${WORK_DIR}/"
          cp scripts/install-rpi.sh  "${WORK_DIR}/"

          tar -czf "webmacs-update-${VERSION}.tar.gz" \
            -C "${WORK_DIR}" \
            manifest.json images.tar docker-compose.prod.yml install-rpi.sh

          SIZE=$(du -sh "webmacs-update-${VERSION}.tar.gz" | cut -f1)
          echo "✅ Bundle: webmacs-update-${VERSION}.tar.gz (${SIZE})"

      - name: Upload bundle artifact
        uses: actions/upload-artifact@v4
        with:
          name: update-bundle
          path: webmacs-update-*.tar.gz

  # ── 3. Create GitHub Release ─────────────────────────────────────────
  release:
    runs-on: ubuntu-latest
    needs: build-and-push
    steps:
      - uses: actions/checkout@v4

      - name: Download bundle
        uses: actions/download-artifact@v4
        with:
          name: update-bundle

      - name: Set version from tag
        id: version
        run: echo "version=${GITHUB_REF_NAME#v}" >> "$GITHUB_OUTPUT"

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          name: "WebMACS v${{ steps.version.outputs.version }}"
          generate_release_notes: true
          files: webmacs-update-*.tar.gz
          body: |
            ## Installation

            ### Option 1 — Docker Hub (recommended)

            ```bash
            curl -sSL https://raw.githubusercontent.com/${{ github.repository }}/main/scripts/install-rpi.sh | sudo bash
            ```

            Images are pulled automatically from Docker Hub:
            - `stefanposs/webmacs-backend:${{ steps.version.outputs.version }}`
            - `stefanposs/webmacs-frontend:${{ steps.version.outputs.version }}`
            - `stefanposs/webmacs-controller:${{ steps.version.outputs.version }}`

            ### Option 2 — Offline OTA Bundle

            **`webmacs-update-${{ steps.version.outputs.version }}.tar.gz`** contains Docker images (multi-arch: amd64 + arm64) for air-gapped installations.

            ```bash
            wget https://github.com/${{ github.repository }}/releases/download/v${{ steps.version.outputs.version }}/webmacs-update-${{ steps.version.outputs.version }}.tar.gz
            sudo bash install-rpi.sh webmacs-update-${{ steps.version.outputs.version }}.tar.gz
            ```

            ### Update existing installation

            **Web UI:** WebMACS → **OTA Updates** → **Upload Bundle**

            **SCP / USB:**
            ```bash
            scp webmacs-update-${{ steps.version.outputs.version }}.tar.gz pi@<device-ip>:/opt/webmacs/updates/
            ```
